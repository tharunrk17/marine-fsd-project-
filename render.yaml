services:
  # Backend Web Service (Node.js API)
  - type: web
    name: marine-pollution-backend
    runtime: node
    rootDir: marine-pollution-monitor/backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # Set this in Render dashboard or prompt during setup
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a secure random secret
      - key: CLIENT_URL
        sync: false # Set to frontend URL once created

  # Frontend Static Site (React/Vite SPA)
  - type: web
    name: marine-pollution-frontend
    runtime: static
    rootDir: marine-pollution-monitor/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to https://<backend-service-url>/api
